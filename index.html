<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Abasto – Empaques, Limpieza y Desechables | León GTO</title>
    <meta name="description"
        content="Grupo Abasto: proveedor mayorista de empaques, limpieza industrial y desechables en León, Guanajuato.">
    <meta http-equiv="refresh" content="2;url=grupo-abasto/catalogo_grupo_abasto.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0d1f35 0%, #1e3a52 60%, #1a4a3a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: #00c97a;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px;
            box-shadow: 0 8px 32px rgba(0, 201, 122, 0.35);
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: #00c97a;
        }

        p {
            color: rgba(255, 255, 255, 0.65);
            font-size: 1rem;
            margin-bottom: 32px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #00c97a;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .redirect-text {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .redirect-text a {
            color: #00c97a;
            text-decoration: none;
            font-weight: 600;
        }

        .redirect-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="loader-container">
        <div class="logo-icon">🚚</div>
        <h1>GRUPO <span>ABASTO</span></h1>
        <p>Empaques, Limpieza y Desechables · León, GTO</p>
        <div class="spinner"></div>
        <p class="redirect-text">
            Cargando catálogo... <br>
            Si no redirige automáticamente,
            <a href="grupo-abasto/catalogo_grupo_abasto.html">haz clic aquí</a>
        </p>
    </div>

    <script>
        // Redirección via JavaScript (más rápida que meta refresh)
        window.location.href = 'grupo-abasto/catalogo_grupo_abasto.html';
    </script>
</body>

</html>
